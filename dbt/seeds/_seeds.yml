version: 2

seeds:
  - name: taxi_zone_lookup
    description: >
      Official TLC Taxi Zone lookup (https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv).
      265 zones; 264 = Unknown, 265 = Outside of NYC.
    columns:
      - name: locationid
        data_tests: [unique, not_null]

  - name: payment_types
    description: Payment type codes from the TLC yellow trip data dictionary.
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]

  - name: rate_codes
    description: Rate code IDs from the TLC yellow trip data dictionary.
    columns:
      - name: rate_code_id
        data_tests: [unique, not_null]

  - name: vendors
    description: TPEP provider (vendor) codes from the TLC yellow trip data dictionary.
    columns:
      - name: vendor_id
        data_tests: [unique, not_null]
